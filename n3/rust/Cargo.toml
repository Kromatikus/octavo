[package]
name = "octavo-n3-draft3"
version = "0.1.0"
edition = "2021"
description = "Octavo N3 draft-3 block function (lab only, not for real secrets)"
publish = false
license = "MIT"

[features]
default = []
# Lab-only CLIs (n3draft, benches, dudect). n3aead stays in the default build.
lab = []

[dependencies]
sha2 = "0.10"
polyval = "0.6"

[[bin]]
name = "n3aead"
path = "src/bin/n3aead.rs"

[[bin]]
name = "n3aeadpv"
path = "src/bin/n3aeadpv.rs"

[[bin]]
name = "n3pvbench"
path = "src/bin/n3pvbench.rs"
required-features = ["lab"]

[[bin]]
name = "n3dudect_pv"
path = "src/bin/n3dudect_pv.rs"
required-features = ["lab"]

[[bin]]
name = "n3draft"
path = "src/bin/n3draft.rs"
required-features = ["lab"]

[[bin]]
name = "n3bench"
path = "src/bin/n3bench.rs"
required-features = ["lab"]

[[bin]]
name = "n3dudect"
path = "src/bin/n3dudect.rs"
required-features = ["lab"]

[[bin]]
name = "n3fbbench"
path = "src/bin/n3fbbench.rs"
required-features = ["lab"]

[[bin]]
name = "n3setupprof"
path = "src/bin/n3setupprof.rs"
required-features = ["lab"]

[[bin]]
name = "n3dudect_tag"
path = "src/bin/n3dudect_tag.rs"
required-features = ["lab"]

[[bin]]
name = "n3dudect_setup"
path = "src/bin/n3dudect_setup.rs"
required-features = ["lab"]

[[bin]]
name = "n3aeadbench"
path = "src/bin/n3aeadbench.rs"
required-features = ["lab"]

[[bin]]
name = "n3layerprof"
path = "src/bin/n3layerprof.rs"
required-features = ["lab"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
